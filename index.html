<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05060d;color:#f3ecff;font-family:'Nunito',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s ease;z-index:5}
.hidden{opacity:0!important;pointer-events:none!important}
#start{background:radial-gradient(ellipse at center,rgba(20,14,50,.25),rgba(5,6,16,.82));cursor:pointer}
#start .title{font-size:clamp(18px,5.6vw,30px);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 14px rgba(255,190,90,.45),0 4px 0 rgba(0,0,0,.5)}50%{text-shadow:0 0 34px rgba(255,200,110,.95),0 4px 0 rgba(0,0,0,.5)}}
.title{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.4vw,24px);line-height:1.8;color:#ffd37a;text-shadow:0 0 18px rgba(255,190,90,.5)}
.sub{margin-top:26px;font-size:15px;opacity:.8;animation:pulse 2.2s ease-in-out infinite}
.tiny{margin-top:10px;font-size:12px;opacity:.45}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
#card{background:radial-gradient(ellipse at center,rgba(28,20,60,.96),rgba(5,6,16,.98));pointer-events:none}
#card .t{letter-spacing:.5px;text-shadow:0 0 24px rgba(255,211,122,.35)}
#card .t::after{content:'';display:block;width:64px;height:3px;border-radius:2px;background:#ffd37a;margin:18px auto 0;box-shadow:0 0 14px rgba(255,211,122,.8)}
#card:not(.hidden) .n{animation:rise .7s ease both}#card:not(.hidden) .t{animation:rise .7s .15s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#card .n{font-family:'Press Start 2P',monospace;font-size:11px;color:#ffd37a;opacity:.8;margin-bottom:16px}
#card .t{font-weight:900;font-size:clamp(24px,7vw,34px)}
#dlg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));min-height:92px;padding:14px 18px 24px;border-radius:14px;
  background:rgba(12,12,30,.9);border:1.5px solid rgba(255,211,122,.35);font-size:clamp(16px,4.3vw,19px);line-height:1.45;z-index:6;transition:opacity .3s,transform .3s}
#dlg.hidden{transform:translateX(-50%) translateY(12px)}
#who{display:table;font-weight:900;font-size:12px;letter-spacing:.6px;color:#1b1430;background:#ffd37a;padding:3px 11px;border-radius:999px;margin-bottom:8px;text-transform:uppercase;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#who[data-s="Я"]{background:#ff9dbb}#who[data-s="Илья"]{background:#8fd0ff}
#dlg{background:linear-gradient(180deg,rgba(30,25,66,.95),rgba(11,10,30,.97))!important;border-radius:18px!important;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.09);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#who:empty{display:none}
#dlg .arrow{position:absolute;right:14px;bottom:7px;font-size:12px;color:#ffd37a;animation:pulse 1.1s infinite;display:none}
#choices{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100% - 40px));z-index:6;transition:opacity .4s}
button{box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);font-family:'Nunito',sans-serif;font-weight:800;font-size:17px;color:#fff3dc;background:linear-gradient(180deg,rgba(44,38,92,.96),rgba(20,18,50,.96));border:1.5px solid rgba(255,211,122,.5);border-radius:12px;padding:14px 16px;cursor:pointer;transition:background .2s,transform .12s}
button:active{transform:scale(.97)}
#hud{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;font-weight:900;font-size:16px;z-index:4;text-shadow:0 2px 6px #000;pointer-events:none;transition:opacity .3s}
#hint{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;font-size:15px;font-weight:700;z-index:4;text-shadow:0 2px 6px #000;pointer-events:none;animation:pulse 1.6s infinite;transition:opacity .3s}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:7;width:38px;height:38px;padding:0;border-radius:50%;font-size:15px;opacity:.55}
#endov{background:rgba(5,6,16,.75);z-index:6}
#noteov{background:rgba(5,6,16,.7);z-index:8;cursor:pointer}
#noteov .paper{max-width:420px;width:calc(100% - 40px);background:#fbf6e9;color:#2b2340;border-radius:4px;padding:26px 24px 30px;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:rotate(-1.5deg);
  font-family:'Caveat',cursive;font-size:clamp(21px,5.6vw,26px);line-height:1.3;text-align:left;background-image:repeating-linear-gradient(transparent 0 33px,rgba(80,110,200,.18) 33px 34px);white-space:pre-line}
#noteov .close{margin-top:22px;font-size:14px;opacity:.7;animation:pulse 1.8s infinite}
#credits{background:#05060d;z-index:8;overflow:hidden;cursor:pointer}
#credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;line-height:1.5}
#credits h2{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.4vw,20px);color:#ffd37a;margin-bottom:46px;line-height:1.8}
#credits .r{margin-bottom:28px}#credits .k{font-size:13px;letter-spacing:1px;opacity:.6;text-transform:uppercase}#credits .v{font-size:22px;font-weight:900}
#tbc{z-index:8;background:#05060d}
#tbc .t{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.6vw,22px);line-height:1.9;color:#fff}
#endov .big{font-family:'Press Start 2P',monospace;font-size:clamp(18px,6vw,30px);line-height:1.6;margin-bottom:22px}

<body>
<canvas id="c"></canvas>
<div id="start" class="ov"><div class="title">одна ночь<br>в питере</div><div class="sub">нажми, чтобы начать</div><div class="tiny">со звуком лучше 🎧</div></div>
<div id="card" class="ov hidden"><div class="n" id="cardN"></div><div class="t" id="cardT"></div></div>
<div id="hud" class="hidden"></div>
<div id="hint" class="hidden"></div>
<div id="dlg" class="hidden"><div id="who"></div><span id="dtext"></span><span class="arrow">▼</span></div>
<div id="choices" class="hidden"></div>
<div id="endov" class="ov hidden"><div class="big" id="endT"></div><div id="endSub" style="opacity:.75;margin-bottom:20px"></div><button id="endBtn"></button></div>
<div id="noteov" class="ov hidden"><div class="paper" id="noteText"></div><div class="close">нажми, чтобы закрыть</div></div>
<div id="tbc" class="ov hidden"><div class="t">продолжение<br>следует…</div></div>
<div id="credits" class="ov hidden"><div class="roll" id="roll"></div></div>
<button id="mute" class="hidden">♪</button>
<script>
/* =============== базовое =============== */
const W=360,H=640;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=1,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px';cv.width=W*k*DPR;cv.height=H*k*DPR;S=k*DPR;}
addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rand=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let time=0, shake=0;
let seedV=5;const srnd=()=>{seedV=(seedV*16807)%2147483647;return (seedV-1)/2147483646};

/* =============== звук =============== */
let AC=null,master,bus,muted=false,padOn=true;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
  const d=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();d.delayTime.value=.33;fb.gain.value=.3;wet.gain.value=.3;d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(master);
  bus=AC.createBiquadFilter();bus.type='lowpass';bus.frequency.value=1600;bus.connect(master);bus.connect(d);padLoop();pluckLoop();}catch(e){AC=null}}
function tone(n,vol=.05,len=1.2,type='sine',when=0,dest){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(n);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(dest||bus);o.start(t);o.stop(t+len+.05);}
function noise(len=.2,vol=.2,freq=800){if(!AC)return;const t=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
function slide(f0,f1,len,vol=.15,type='sine'){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(master);o.start(t);o.stop(t+len);}
const SFX={
  pop:()=>tone(84,.07,.25,'triangle'),
  ding:()=>{tone(88,.1,1.6);tone(95,.07,1.8,'sine',.05)},
  bonk:()=>{slide(320,70,.25,.3,'square');noise(.12,.3,1500)},
  fail:()=>{tone(52,.08,.35,'sawtooth');tone(51,.08,.4,'sawtooth',.15)},
  click:()=>noise(.04,.25,4000),
  off:()=>{slide(400,40,.6,.25,'sawtooth');noise(.3,.2,600)},
  whoosh:()=>noise(.35,.15,2500),
  win:()=>{[72,76,79,84].forEach((n,i)=>tone(n,.07,.6,'triangle',i*.09))},
  hit:()=>{tone(91,.06,.12,'square');noise(.05,.15,5000)},
  crash:()=>{noise(.6,.45,900);slide(200,40,.5,.3,'square')}
};
const CH=[[57,64,67,72],[53,60,65,69],[48,55,64,67],[55,62,67,71]];let ci=0;
function padLoop(){if(!AC)return;if(padOn){const ch=CH[ci++%4];for(const n of ch){tone(n-12,.022,6.5,'sine');tone(n-12,.01,6.5,'triangle')}}setTimeout(padLoop,6000)}
const PENTA=[69,72,74,76,79,81,84];
function pluckLoop(){if(!AC)return;if(padOn&&Math.random()<.6)tone(PENTA[Math.random()*7|0],.025,1.6);setTimeout(pluckLoop,1200+Math.random()*1500)}
// финальная «ночная» музыка (своя, в духе синтвейва)
let driveTimer=null;
function driveMusic(on){
  if(!AC)return;clearInterval(driveTimer);if(!on)return;padOn=false;let step=0;
  const prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  driveTimer=setInterval(()=>{const ch=prog[(step>>4)%4],s=step%16;
    if(s%4===0)tone(ch[0]-24,.09,.5,'sawtooth');
    tone(ch[s%3]+12+(s>7?12:0),.035,.25,'triangle');
    if(s===0){for(const n of ch)tone(n,.025,2.6,'sawtooth')}
    if(s%8===4)noise(.08,.08,6000);
    step++;},150);
}
$('mute').onclick=e=>{e.stopPropagation();if(!AC)return;muted=!muted;master.gain.value=muted?0:.6;$('mute').textContent=muted?'✕':'♪'};

/* =============== UI: диалоги, выборы, тапы =============== */
let qLines=[],qDone=null,full='',typing=false,tmr=null;
function say(lines){return new Promise(res=>{qLines=lines.slice();qDone=res;$('dlg').classList.remove('hidden');nextLine();});}
function nextLine(){if(!qLines.length){$('dlg').classList.add('hidden');const r=qDone;qDone=null;setTimeout(()=>r&&r(),250);return;}
  const [w,t]=qLines.shift();$('who').textContent=w||'';$('who').dataset.s=w||'';full=t;let i=0;typing=true;$('dtext').textContent='';$('dlg').querySelector('.arrow').style.display='none';clearInterval(tmr);
  tmr=setInterval(()=>{i++;$('dtext').textContent=full.slice(0,i);if(i>=full.length){clearInterval(tmr);typing=false;$('dlg').querySelector('.arrow').style.display='block'}},28);}
function advance(){if(typing){clearInterval(tmr);$('dtext').textContent=full;typing=false;$('dlg').querySelector('.arrow').style.display='block';return}nextLine();}
const dlgOpen=()=>!$('dlg').classList.contains('hidden');
function choose(opts){return new Promise(res=>{const c=$('choices');c.innerHTML='';opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=e=>{e.stopPropagation();SFX.click();c.classList.add('hidden');res(i)};c.appendChild(b)});c.classList.remove('hidden');});}
function hud(t){if(t==null){$('hud').classList.add('hidden');return}$('hud').textContent=t;$('hud').classList.remove('hidden')}
function hint(t){if(t==null){$('hint').classList.add('hidden');return}$('hint').textContent=t;$('hint').classList.remove('hidden')}
let tapWaiter=null;
function waitTap(){return new Promise(r=>tapWaiter=r)}
let fadeA=0,fadeT=0;
async function card(n,t){$('cardN').textContent=n;$('cardT').textContent=t;$('card').classList.remove('hidden');await sleep(1900);fadeA=1;fadeT=1;$('card').classList.add('hidden');await sleep(450);}
function toVirtual(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
addEventListener('pointerdown',e=>{
  if(!started)return;if(e.target.tagName==='BUTTON')return;
  if(dlgOpen()){advance();return}
  const [x,y]=toVirtual(e);
  if(tapWaiter){const r=tapWaiter;tapWaiter=null;r([x,y]);return}
  if(scene&&scene.tap)scene.tap(x,y);
});

/* =============== рисование: персонажи =============== */
const HER={hair:'long',hairC:'#0f0e13',glasses:true,choker:true,top:'#17161e',pants:'#252a40',eye:'#2a2224',bag:true};
const HIM={hair:'curly',hairC:'#86694c',top:'#17161e',pants:'#262a40',eye:'#3d5f8f'};
const CASHIER={hair:'bun',hairC:'#a3a2ae',top:'#7a3b5a',apron:'#3d6a8a',pants:'#333',eye:'#333'};
const JOCK={hair:'buzz',hairC:'#3a2a20',top:'#c0392b',pants:'#222',eye:'#333',wide:true};
const PSY={hair:'dark',hairC:'#18141a',top:'#0b0b10',pants:'#0b0b10',coat:true,beard:true,eye:'#222'};
const ADMIN={hair:'short',hairC:'#5a3a22',top:'#2d6a4f',pants:'#222',eye:'#333'};
const BARMAN={hair:'short',hairC:'#222',top:'#e9e6ef',pants:'#222',eye:'#333',beard:true};
const VENDOR={hair:'short',hairC:'#15110f',top:'#f5f5f5',apron:'#e64a19',pants:'#333',eye:'#2a1a12',beard:true,skin:'#dcae8a'};
const CHEF={hair:'short',hairC:'#3a2a20',top:'#f5f5f5',pants:'#333',eye:'#333',hat:'chef',beard:true};
const STUDENT={hair:'bun',hairC:'#b5651d',top:'#8e7cc3',pants:'#333',eye:'#333',apron:'#fff'};
const GUY={hair:'short',hairC:'#c99a5b',top:'#3a5ba0',pants:'#222',eye:'#333'};
const SKIN='#f4d5c3';
function person(x,y,s,face,o,p={}){
  const sw=p.walk?Math.sin(p.phase||0):0,bob=p.walk?Math.abs(Math.sin(p.phase||0))*1.5:0;
  ctx.save();ctx.translate(x,y-bob*s);ctx.rotate(p.rot||0);ctx.scale(face*s,s);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,bob,11,2.5,0,0,7);ctx.fill();
  const bw=o.wide?11.5:9;
  if(o.hair==='long'){ctx.fillStyle=o.hairC;ctx.beginPath();ctx.moveTo(-12,-50);ctx.quadraticCurveTo(-15,-30,-11,-22);ctx.lineTo(10,-22);ctx.quadraticCurveTo(14,-34,12,-50);ctx.closePath();ctx.fill();}
  if(o.bag){ctx.fillStyle='#0a0a0d';rr(-16,-36,8,19,3);ctx.fill();}
  if(p.sit){for(const k of[-1,1]){ctx.save();ctx.translate(k*1.5,-14);ctx.fillStyle=o.pants;ctx.fillRect(-2,-2.6,15,5.2);ctx.fillRect(10.4,0,5.2,13);ctx.fillStyle='#0c0c12';ctx.fillRect(10,12,8,3);ctx.restore();}}
  else if(!p.noLegs)for(const k of[-1,1]){ctx.save();ctx.translate(k*3,-14);ctx.rotate(k*sw*.55);ctx.fillStyle=o.pants;ctx.fillRect(-2.6,0,5.2,12.5);ctx.fillStyle='#0c0c12';ctx.fillRect(-3,11.5,7,3);ctx.restore();}
  // задняя рука
  ctx.save();ctx.translate(-bw+2.5,-33);ctx.rotate(p.arm2!=null?p.arm2:sw*.5);ctx.fillStyle=o.top;ctx.fillRect(-2.2,0,4.4,12);ctx.fillStyle=(o.skin||SKIN);ctx.beginPath();ctx.arc(0,13,2.4,0,7);ctx.fill();ctx.restore();
  // тело
  ctx.fillStyle=o.top;ctx.beginPath();const bot=o.coat?-5:-13;ctx.moveTo(-bw+1,-36);ctx.lineTo(bw-1,-36);ctx.lineTo(bw+(o.coat?3:0),bot);ctx.lineTo(-bw-(o.coat?3:0),bot);ctx.closePath();ctx.fill();
  {const sg=ctx.createLinearGradient(-bw,0,bw,0);sg.addColorStop(0,'rgba(0,0,0,.28)');sg.addColorStop(.55,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(255,255,255,.07)');ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(-bw+1,-36);ctx.lineTo(bw-1,-36);ctx.lineTo(bw+(o.coat?3:0),bot);ctx.lineTo(-bw-(o.coat?3:0),bot);ctx.closePath();ctx.fill();}
  if(o.apron){ctx.fillStyle=o.apron;ctx.fillRect(-7,-32,14,19);}
  if(o.bag){ctx.fillStyle='#0a0a0d';ctx.fillRect(-6,-36,2,14);}
  ctx.fillStyle=(o.skin||SKIN);ctx.fillRect(-2.5,-39,5,4);
  if(o.choker){ctx.fillStyle='#050505';ctx.fillRect(-3,-38.3,6,1.7);}
  // передняя рука
  ctx.save();ctx.translate(bw-2.5,-33);
  let a=-sw*.5;if(p.arm==='up')a=-2.6+Math.sin(time*9)*(p.waveA||0);else if(p.arm==='hold')a=-1.25;else if(p.arm==='throw')a=-3.3;else if(p.arm==='mic')a=-2.1;else if(p.arm!=null&&typeof p.arm==='number')a=p.arm;
  ctx.rotate(a);ctx.fillStyle=o.top;ctx.fillRect(-2.2,0,4.4,12);ctx.fillStyle=(o.skin||SKIN);ctx.beginPath();ctx.arc(0,13,2.4,0,7);ctx.fill();
  if(p.item)drawItem(p.item,0,14,p);
  ctx.restore();
  // голова
  ctx.fillStyle=(o.skin||SKIN);ctx.beginPath();ctx.arc(0,-49,11.5,0,7);ctx.fill();
  {const hg=ctx.createRadialGradient(4,-53,2,0,-49,12.5);hg.addColorStop(0,'rgba(255,255,255,.18)');hg.addColorStop(.7,'rgba(0,0,0,0)');hg.addColorStop(1,'rgba(120,60,50,.22)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-49,11.5,0,7);ctx.fill();}
  ctx.fillStyle='rgba(240,140,140,.33)';ctx.beginPath();ctx.arc(-1,-45,2.2,0,7);ctx.arc(8,-45,2.2,0,7);ctx.fill();
  const mood=p.mood||'smile';
  ctx.fillStyle=o.eye;
  if(p.closed||mood==='mystic'){ctx.strokeStyle=o.eye;ctx.lineWidth=1;ctx.beginPath();ctx.arc(-.5,-49,1.6,.2,Math.PI-.2);ctx.stroke();ctx.beginPath();ctx.arc(6.5,-49,1.6,.2,Math.PI-.2);ctx.stroke();}
  else if(mood==='dizzy'){ctx.strokeStyle='#333';ctx.lineWidth=1;for(const ex of[-.5,6.5]){ctx.beginPath();ctx.moveTo(ex-1.6,-50.6);ctx.lineTo(ex+1.6,-47.4);ctx.moveTo(ex+1.6,-50.6);ctx.lineTo(ex-1.6,-47.4);ctx.stroke();}}

  hat(t,open=false,v=1){nsrc(t,open?.22:.045,'highpass',7500,.7,.22*v,musBus);},
  cowbell(t,n,v=1){const f=mtof(n),bp=AC.createBiquadFilter(),g=AC.createGain();bp.type='bandpass';bp.frequency.value=f*1.2;bp.Q.value=2.5;
    for(const r of[1,1.48]){const o=AC.createOscillator();o.type='square';o.frequency.value=f*r;o.connect(bp);o.start(t);o.stop(t+.35);}
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.24*v,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.3);bp.connect(g);g.connect(musBus);if(bus){const g2=AC.createGain();g2.gain.value=.25;g.connect(g2);g2.connect(bus);}},
  saw(t,n,dur,vol,cut=1400,dest){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(cut,t);lp.Q.value=2;const g=AC.createGain();
    for(const dt of[-8,7]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mtof(n);o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.1);}
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.4,dur*.3));g.gain.setValueAtTime(vol,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);lp.connect(g);g.connect(dest||musBus);},
  bass(t,n,dur){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(220,t+dur);const g=AC.createGain();const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mtof(n);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(musBus);o.start(t);o.stop(t+dur+.05);},
  pluck(t,n,v=.1){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(3500,t);lp.frequency.exponentialRampToValueAtTime(600,t+.2);
    o.type='square';o.frequency.value=mtof(n);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(lp);lp.connect(g);g.connect(musBus);if(bus)g.connect(bus);o.start(t);o.stop(t+.3);},
};
// --- секвенсор ---
const MUS={track:null,step:0,next:0,timer:null,bpm:120};
function musicPlay(name){if(!AC)return;audioV2();MUS.track=name;padOn=!name;if(name){musBus.gain.setValueAtTime(name==='phonk'?.8:1.5,AC.currentTime);MUS.bpm=name==='phonk'?130:100;MUS.step=0;MUS.next=AC.currentTime+.08;if(!MUS.timer)MUS.timer=setInterval(musTick,25);}}
function musTick(){if(!MUS.track||!AC)return;const spb=60/MUS.bpm/4;while(MUS.next<AC.currentTime+.14){schedStep(MUS.track,MUS.step,MUS.next,spb);MUS.next+=spb;MUS.step++;}}
const PH_KICK=[1,0,0,1,0,0,1,0,0,0,1,0,0,1,0,0];
const PH_MEL=[[77,0,77,0,80,0,77,0,82,0,80,0,77,0,75,0],[77,0,77,0,80,0,84,0,82,0,80,0,77,0,72,0],[77,0,77,0,80,0,77,0,82,0,84,0,85,0,84,0],[82,0,80,0,77,0,80,0,77,0,75,0,72,0,75,0]];
const PH_ROOT=[41,37,39,36];
const DR_CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const DR_LEAD=[[76,0,0,0,74,0,72,0,0,0,71,0,72,0,0,0],[69,0,0,0,0,0,72,0,74,0,0,0,72,0,0,0],[67,0,0,0,72,0,0,0,76,0,0,0,74,0,72,0],[71,0,0,0,0,0,0,0,74,0,0,0,0,0,0,0]];
function schedStep(tr,step,t,spb){const bar=(step>>4)%4,s=step%16,intro=step<16;
  if(tr==='phonk'){
    if(PH_MEL[bar][s])I.cowbell(t,PH_MEL[bar][s]);
    if(intro)return;
    if(PH_KICK[s]){I.kick(t);I.k808(t,PH_ROOT[bar],spb*(s===10?5:3));}
    if(s===4||s===12)I.clap(t);
    if(s%2===0)I.hat(t,false,.8);else if(bar===3&&s>12)I.hat(t,false,.6);
    if(s===14&&bar%2===1)I.hat(t,true,.6);
  }else if(tr==='drive'){
    const ch=DR_CH[bar];
    if(s===0)for(const n of ch)I.saw(t,n,spb*16,.06,1800,musBus);
    if(s%2===0)I.bass(t,ch[0]-24+(s%4===2?12:0),spb*1.8);
    I.pluck(t,ch[[0,1,2,1][s%4]]+12+(s>=8?12:0),.08);
    if(step>=32&&DR_LEAD[bar][s])I.saw(t,DR_LEAD[bar][s],spb*3.5,.09,2800);
    if(intro)return;
    if(s%4===0)I.kick(t,1.1);
    if(s===4||s===12)I.snare(t,1.4);
    if(s%2===1)I.hat(t,false,.7);
  }
}
function scratch(){if(!AC)return;const t=AC.currentTime;osc(t,'sawtooth',900,120,.35,.25,master,.3);nsrc(t,.3,'bandpass',1200,1,.3,master);}
// --- окружение ---
const AMB={type:null,nodes:[],timer:null};
function loopNoise(type,freq,q,vol,lfo){const s=AC.createBufferSource();s.buffer=NBUF;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.value=0;
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+1.5);s.connect(f);f.connect(g);g.connect(ambBus);s.start();
  if(lfo){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=lfo;lg.gain.value=vol*.5;l.connect(lg);lg.connect(g.gain);l.start();AMB.nodes.push(l);}
  AMB.nodes.push(s);AMB.gains=(AMB.gains||[]).concat(g);return g;}
function loopTone(type,f,cut,vol){const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type=type;o.frequency.value=f;lp.type='lowpass';lp.frequency.value=cut;g.gain.value=0;g.gain.linearRampToValueAtTime(vol,AC.currentTime+1);o.connect(lp);lp.connect(g);g.connect(ambBus);o.start();AMB.nodes.push(o);AMB.gains=(AMB.gains||[]).concat(g);return g;}
function setAmb(type){if(!AC)return;audioV2();if(AMB.type===type)return;
  const t=AC.currentTime;for(const g of AMB.gains||[]){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.8);}
  const old=AMB.nodes;setTimeout(()=>old.forEach(n=>{try{n.stop()}catch(e){}}),1000);AMB.nodes=[];AMB.gains=[];clearInterval(AMB.timer);AMB.type=type;if(!type)return;
  if(type==='city'||type==='scoot'){loopNoise('lowpass',260,.5,.34);loopNoise('bandpass',900,.4,.06,.08);
    if(type==='scoot'){AMB.motor=loopTone('sawtooth',62,260,.05);loopNoise('bandpass',1800,.8,.02);}
    AMB.timer=setInterval(()=>{const r=Math.random(),t=AC.currentTime;
      if(r<.12){const f=nsrc(t,2.6,'bandpass',300,1,.12,ambBus,1.2);f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(900,t+1.2);f.frequency.exponentialRampToValueAtTime(200,t+2.6);}
      else if(r<.14){osc(t,'square',mtof(62),0,.35,.02,ambBus);osc(t+.4,'square',mtof(62),0,.25,.02,ambBus);}
      else if(r<.2)nsrc(t,1.5,'highpass',3000,.5,.025,ambBus,.6);},700);}
  else if(type==='bowl'){ // без уличного гула: катящийся шар, кегли, редкие возгласы
    AMB.timer=setInterval(()=>{const t=AC.currentTime,r=Math.random();
      if(r<.22){const f=nsrc(t,1.6,'bandpass',120,2,.2,ambBus,.4);f.frequency.setValueAtTime(90,t);f.frequency.linearRampToValueAtTime(160,t+1.5);
        setTimeout(()=>{if(AMB.type==='bowl'){const t2=AC.currentTime;for(let k=0;k<6;k++)nsrc(t2+k*rand(.015,.04),.16,'bandpass',rand(1400,3000),3,.09,ambBus);}},1550);}
      else if(r<.3){for(let k=0;k<2;k++)osc(t+k*.12,'triangle',rand(220,330),0,.18,.03,ambBus);}
      else if(r<.36)for(let k=0;k<5;k++)nsrc(t+k*.1,.06,'bandpass',1300,1,.05,ambBus);},700);}
  else if(type==='club'){ // кулеры ПК + клавиатуры и мышки
    loopNoise('bandpass',3200,2,.012);
    AMB.timer=setInterval(()=>{const t=AC.currentTime;const n=Math.random()*7|0;for(let k=0;k<n;k++)nsrc(t+k*rand(.05,.12),.025,'highpass',4000,1,.07,ambBus);
      if(Math.random()<.25)nsrc(t+.3,.02,'bandpass',2500,4,.08,ambBus);},500);}
  else if(type==='bar'){ // тихая лаунж-музыка + звон бокалов
    let st=0;AMB.timer=setInterval(()=>{const t=AC.currentTime,ch=[[50,57,60,64],[45,52,55,60],[48,55,59,62],[43,50,53,57]][(st>>3)%4];
      if(st%8===0)for(const n of ch.slice(1))osc(t,'triangle',mtof(n),0,2.6,.012,ambBus);
      if(st%2===0)osc(t,'sine',mtof(ch[0]-12),0,.5,.05,ambBus);
      if(Math.random()<.08){for(let k=0;k<2;k++)osc(t+k*.07,'sine',mtof(98+k*4),0,.3,.02,ambBus);}
      st++;},420);}
  else if(type==='aqua'){ // подводные пузырьки и мягкий гул
    loopTone('sine',58,120,.025);
    AMB.timer=setInterval(()=>{const t=AC.currentTime;if(Math.random()<.6){const n=1+(Math.random()*3|0);for(let k=0;k<n;k++)osc(t+k*.08,'sine',rand(400,800),rand(1100,1900),.08,.035,ambBus,.07);}},380);}
  else if(type==='shop'){loopTone('sawtooth',50,140,.03);
    AMB.timer=setInterval(()=>{const t=AC.currentTime;if(Math.random()<.12){osc(t,'square',1850,0,.08,.02,ambBus);}},900);}
  else if(type==='kitchen'){ // шкворчание + посуда
    loopNoise('highpass',3500,.5,.018,1.3);
    AMB.timer=setInterval(()=>{const t=AC.currentTime;if(Math.random()<.35)osc(t,'sine',rand(1800,3200),0,.25,.02,ambBus);if(Math.random()<.4)nsrc(t,.04,'bandpass',rand(2500,4000),4,.06,ambBus);},500);}
  else if(type==='home'){loopTone('sine',100,160,.01);}
}
function crunch(){if(!AC)return;audioV2();const t=AC.currentTime;nsrc(t,.09,'bandpass',rand(1800,3200),1.4,.14,ambBus);nsrc(t+.02,.06,'highpass',4500,.7,.05,ambBus);}
function ambFor(sc){if(sc===sHome)return'home';if(sc===sShop)return'shop';if(sc===sBowl)return'bowl';if(sc===sClub)return'club';if(sc===sRoll)return'kitchen';if(sc===sAqua)return'aqua';if(sc===sBar)return'bar';if(sc===sScoot)return'scoot';return'city';}
let lastStep=0;

/* =============== цикл =============== */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  ctx.setTransform(S,0,0,S,0,0);
  if(shake>0){shake=Math.max(0,shake-dt);ctx.translate(rand(-1,1)*shake*12,rand(-1,1)*shake*12);}
  try{if(scene){scene.update&&scene.update(dt);scene.draw(dt);}else{night(time*20);}}catch(e){if(!window.__err){window.__err=1;console.error(e);}}
  drawVap(dt);
  const outdoor=!scene||[sShawa,sPower,sPsy,sScoot,sEnd,wClub,wCook,wAqua,wBar].includes(scene);if(outdoor)snow(dt,scene===sScoot||scene===sEnd||(scene&&scene.walking!==undefined)?1:0);
  if(scene&&(scene.walking||(scene===sAqua&&sAqua.walking))&&time-lastStep>.36){lastStep=time;crunch();}
  drawParts(dt);
  {const v=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=v;ctx.fillRect(-20,-20,W+40,H+40);}
  fadeA+=(fadeT-fadeA)*Math.min(1,dt*7);if(fadeA>.01){ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle=`rgba(5,6,13,${fadeA})`;ctx.fillRect(-20,-20,W+40,H+40);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
